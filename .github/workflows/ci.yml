name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a tag run while it may be assembling or publishing a draft.
  # A second run for the same tag waits, then safely resumes or verifies the
  # exact prerelease instead of racing the first run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-metadata:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      is_rc: ${{ steps.release.outputs.is_rc }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and changelog
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Classify release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "is_rc=true" >>"$GITHUB_OUTPUT"
            echo "artifact_name=github-prerelease-${RELEASE_TAG}" >>"$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Prepare source prerelease bundle
        if: steps.release.outputs.is_rc == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive_root="xray-rust-${version}"
          output_dir="$RUNNER_TEMP/github-prerelease"
          archive="$output_dir/${archive_root}.tar.gz"
          mkdir -p "$output_dir"

          awk -v plain="## $version - " -v bracketed="## [$version] - " '
            index($0, plain) == 1 || index($0, bracketed) == 1 {
              capture = 1
              next
            }
            capture && /^## / { exit }
            capture { print }
            END { if (!capture) exit 1 }
          ' CHANGELOG.md >"$output_dir/release-notes.md"
          if ! grep -q '[^[:space:]]' "$output_dir/release-notes.md"; then
            echo "release notes are empty for $version" >&2
            exit 1
          fi

          git archive \
            --format=tar \
            --prefix="${archive_root}/" \
            "${RELEASE_TAG}^{commit}" \
            | gzip -n >"$archive"

          (
            cd "$output_dir"
            sha256sum "$(basename "$archive")" >SHA256SUMS
          )

          {
            tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tag}")"
            commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "tag_object=$tag_object"
            echo "commit=$commit"
          } >"$output_dir/release-metadata.txt"

      - name: Upload source prerelease bundle
        if: steps.release.outputs.is_rc == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ runner.temp }}/github-prerelease
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject retired profile values
        env:
          XRAY_FIXTURE_SCAN_HISTORY: "1"
        run: bash scripts/tests/check-public-fixtures.test.sh

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"

      - name: Scan complete Git history for common secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --redact=100 \
            --no-banner \
            --log-opts="--all" \
            .

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository scripts
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done
          bash scripts/tests/check-release-version.test.sh
          bash scripts/tests/check-prerelease-workflow.test.sh
          bash scripts/tests/check-rc-interop.test.sh
          bash scripts/tests/check-scheduled-pinned-interop.test.sh
          bash scripts/tests/check-xray-main-smoke.test.sh
          bash scripts/tests/check-scheduled-interop-workflow.test.sh
          bash scripts/tests/check-public-fixtures.test.sh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::perf -W clippy::suspicious

      - name: Test
        # `--all-targets` overrides the fuzz bins' `test = false` metadata and
        # would otherwise launch their libFuzzer mains without a run bound.
        run: cargo test --workspace --exclude xray-rust-fuzz --all-targets --locked

      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Test mobile build-script guards
        run: bash scripts/tests/check-mobile-toolchains.test.sh

  go-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One toolchain builds all three oracle modules: the root one declares
      # `go 1.24` and the masquerade and gRPC ones `go 1.26`, and a `go`
      # directive is a minimum. The committed fixtures reproduce byte for byte
      # under 1.24.0, 1.26.0, 1.26.3 and 1.26.5, so the pin below is a pin, not
      # a constraint.
      #
      # Every module's `go.sum` is listed: the cache key is built from these
      # paths alone, so a module missing from the list has its dependencies
      # re-downloaded on every run.
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            tools/reality-oracle/masquerade/go.sum
            tools/reality-oracle/grpc/go.sum

      - name: Verify Go-oracle fixtures
        run: bash scripts/verify-oracle-fixtures.sh

  rc-interop:
    if: needs.release-metadata.outputs.is_rc == 'true'
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Xray-core oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XTLS/Xray-core
          ref: 5ca6f4b7d4dc20a881d4330e498892697627ec0c
          path: Xray-core
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: Xray-core/go.sum

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Run release-candidate interoperability gate
        env:
          XRAY_CORE_CHECKOUT: ${{ github.workspace }}/Xray-core
        run: bash scripts/check-rc-interop.sh

  scheduled-pinned-interop:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out scheduled xray-rust revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned Xray-core oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XTLS/Xray-core
          ref: 5ca6f4b7d4dc20a881d4330e498892697627ec0c
          path: Xray-core
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: Xray-core/go.sum

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Run broad pinned interoperability and resource gate
        env:
          XRAY_CORE_CHECKOUT: ${{ github.workspace }}/Xray-core
        run: bash scripts/check-scheduled-pinned-interop.sh

  xray-core-main-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out scheduled xray-rust revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Xray-core main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XTLS/Xray-core
          ref: main
          path: Xray-core
          persist-credentials: false

      - name: Resolve Xray-core main revision
        id: xray
        run: |
          revision="$(git -C Xray-core rev-parse --verify HEAD)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Xray-core main resolved to invalid revision: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >>"$GITHUB_OUTPUT"
          printf 'Xray-core main revision: `%s`\n' "$revision" >>"$GITHUB_STEP_SUMMARY"

      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: Xray-core/go.sum

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Run focused Xray-core main compatibility smoke
        env:
          XRAY_CORE_CHECKOUT: ${{ github.workspace }}/Xray-core
          XRAY_CORE_EXPECTED_REVISION: ${{ steps.xray.outputs.revision }}
        run: bash scripts/check-xray-main-smoke.sh

      - name: Report warning-only compatibility failure
        if: failure()
        run: echo "::warning title=Xray-core main compatibility smoke failed::revision=${{ steps.xray.outputs.revision }} run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  fuzz-smoke:
    if: needs.release-metadata.outputs.is_rc == 'true'
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-05-22 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-05-22 install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded parser and wire fuzz campaigns
        run: |
          cargo +nightly-2026-05-22 fuzz run config_json -- -runs=512 -max_len=65536 -timeout=10
          cargo +nightly-2026-05-22 fuzz run dns_wire -- -runs=512 -max_len=65536 -timeout=10
          cargo +nightly-2026-05-22 fuzz run vless_wire -- -runs=512 -max_len=65536 -timeout=10

      - name: Run bounded FFI lifecycle fuzz campaign
        run: cargo +nightly-2026-05-22 fuzz run ffi_lifecycle -- -runs=64 -max_len=16384 -timeout=15

  apple:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          rustup toolchain install nightly-2026-05-22 \
            --profile minimal \
            --component rust-src

      - name: Build Apple XCFramework
        run: bash scripts/build-apple-xcframework.sh

      # Ahead of the Swift tests: the regional-routing test builds a real core
      # over rules carrying geosite/geoip matchers, so it needs the .dat files
      # that are gitignored and fetched here.
      - name: Install pinned Apple sample geodata
        run: bash scripts/fetch-geodata.sh

      - name: Test Swift package
        env:
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/target/mobile/apple-clang-module-cache
          HOME: ${{ github.workspace }}/target/mobile/apple-swiftpm-test-home
        run: |
          mkdir -p "$CLANG_MODULE_CACHE_PATH" "$HOME"
          swift test --disable-sandbox --package-path platform/apple

      - name: Check Apple adapter links
        env:
          XRAY_USE_PREBUILT_ARTIFACTS: "1"
        run: bash scripts/check-apple-adapter-link.sh

      - name: Build unsigned Apple sample apps
        run: |
          project="platform/apple/XrayClient/XrayClient.xcodeproj"
          derived_data="$RUNNER_TEMP/xray-apple-sample"

          xcodebuild \
            -project "$project" \
            -scheme XrayClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          xcodebuild \
            -project "$project" \
            -scheme XrayClientTv \
            -configuration Debug \
            -sdk appletvsimulator \
            -destination "generic/platform=tvOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          xcodebuild \
            -project "$project" \
            -scheme XrayClientMac \
            -configuration Debug \
            -sdk macosx \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install pinned Android SDK components
        run: |
          # The runner image installs the command-line tools but puts no
          # Android bin directory on PATH.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Build and verify Android AAR
        run: bash scripts/build-android-adapter.sh

      - name: Test Android adapter
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/target/mobile/android-gradle-home
          XRAY_FFI_ANDROID_DIR: ${{ github.workspace }}/target/mobile/android
        run: |
          platform/android/gradlew \
            -p platform/android \
            :xraymobile:testDebugUnitTest \
            --no-daemon

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Install pinned dependency scanners
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.4 --locked

      - name: Verify Gradle wrapper JAR
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  platform/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          grep -Fxq \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-bin.zip' \
            platform/android/gradle/wrapper/gradle-wrapper.properties
          grep -Fxq \
            'distributionSha256Sum=7197a12f450794931532469d4ff21a59ea2c1cd59a3ec3f89c035c3c420a6999' \
            platform/android/gradle/wrapper/gradle-wrapper.properties

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny --locked check advisories bans licenses sources

      - name: Verify pinned geodata downloads
        if: github.event_name == 'schedule'
        run: bash scripts/fetch-geodata.sh --output-dir "$RUNNER_TEMP/geodata"

  publish-prerelease:
    if: needs.release-metadata.outputs.is_rc == 'true'
    needs:
      - release-metadata
      - secrets
      - rust
      - go-oracles
      - rc-interop
      - fuzz-smoke
      - apple
      - android
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job deliberately does not check out or execute repository code.
      # The write-scoped token is exposed only after every CI gate succeeds.
      - name: Download verified source prerelease bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-metadata.outputs.artifact_name }}
          path: release-bundle

      - name: Verify remote tag and release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "refusing to publish a non-RC tag: $RELEASE_TAG" >&2
            exit 1
          fi

          cd release-bundle
          sha256sum --check SHA256SUMS
          grep -Fxq "tag=$RELEASE_TAG" release-metadata.txt
          grep -Fxq "version=${RELEASE_TAG#v}" release-metadata.txt

          expected_tag_object="$(sed -n 's/^tag_object=//p' release-metadata.txt)"
          expected_commit="$(sed -n 's/^commit=//p' release-metadata.txt)"
          if [[ ! "$expected_tag_object" =~ ^[0-9a-f]{40}$ || ! "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release metadata contains an invalid Git object ID" >&2
            exit 1
          fi

          remote_tag="$(
            gh api \
              "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.sha + " " + .object.type'
          )"
          read -r remote_tag_object remote_tag_type <<<"$remote_tag"
          if [[ "$remote_tag_type" != "tag" || "$remote_tag_object" != "$expected_tag_object" ]]; then
            echo "remote release tag is not the verified annotated tag" >&2
            exit 1
          fi

          remote_target="$(
            gh api \
              "repos/$RELEASE_REPOSITORY/git/tags/$remote_tag_object" \
              --jq '.object.sha + " " + .object.type'
          )"
          read -r remote_commit remote_target_type <<<"$remote_target"
          if [[ "$remote_target_type" != "commit" || "$remote_commit" != "$expected_commit" ]]; then
            echo "remote annotated tag does not target the verified commit" >&2
            exit 1
          fi

      - name: Create, resume, or verify GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-bundle
          archive="xray-rust-${RELEASE_TAG#v}.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "source archive is missing: $archive" >&2
            exit 1
          fi
          if [[ ! -f SHA256SUMS || ! -f release-notes.md ]]; then
            echo "release checksums or notes are missing" >&2
            exit 1
          fi

          expected_title="xray-rust $RELEASE_TAG"
          expected_body="$(cat release-notes.md)"

          expected_tag_object="$(sed -n 's/^tag_object=//p' release-metadata.txt)"
          expected_commit="$(sed -n 's/^commit=//p' release-metadata.txt)"
          if [[ ! "$expected_tag_object" =~ ^[0-9a-f]{40}$ || ! "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release metadata contains an invalid Git object ID" >&2
            exit 1
          fi

          verify_remote_tag() {
            local remote_tag remote_tag_object remote_tag_type
            local remote_target remote_commit remote_target_type
            remote_tag="$(
              gh api \
                "repos/$RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '.object.sha + " " + .object.type'
            )"
            read -r remote_tag_object remote_tag_type <<<"$remote_tag"
            if [[ "$remote_tag_type" != "tag" || "$remote_tag_object" != "$expected_tag_object" ]]; then
              echo "remote release tag is not the verified annotated tag" >&2
              return 1
            fi

            remote_target="$(
              gh api \
                "repos/$RELEASE_REPOSITORY/git/tags/$remote_tag_object" \
                --jq '.object.sha + " " + .object.type'
            )"
            read -r remote_commit remote_target_type <<<"$remote_target"
            if [[ "$remote_target_type" != "commit" || "$remote_commit" != "$expected_commit" ]]; then
              echo "remote annotated tag does not target the verified commit" >&2
              return 1
            fi
          }

          # Querying first makes retries idempotent. If the query fails because
          # the release is absent, draft creation is atomic; if it failed for a
          # transient/auth reason while a release exists, creation fails rather
          # than mutating that existing release.
          release_json=""
          if release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --json isDraft,isPrerelease,name,body 2>/dev/null
          )"; then
            echo "Found an existing release for $RELEASE_TAG; verifying it before resuming"
          else
            verify_remote_tag
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --draft \
              --prerelease \
              --latest=false \
              --verify-tag \
              --title "$expected_title" \
              --notes-file release-notes.md
            release_json="$(
              gh release view "$RELEASE_TAG" \
                --repo "$RELEASE_REPOSITORY" \
                --json isDraft,isPrerelease,name,body
            )"
          fi

          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          release_name="$(jq -r '.name' <<<"$release_json")"
          release_body="$(jq -r '.body' <<<"$release_json")"
          if [[ "$is_prerelease" != "true" ]]; then
            echo "refusing to mutate a non-prerelease GitHub release for $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$release_name" != "$expected_title" || "$release_body" != "$expected_body" ]]; then
            echo "refusing to mutate a prerelease whose title or notes do not match the verified bundle" >&2
            exit 1
          fi

          load_assets() {
            local asset_output
            asset_output="$(
              gh release view "$RELEASE_TAG" \
                --repo "$RELEASE_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            mapfile -t release_assets < <(
              printf '%s\n' "$asset_output" | sed '/^$/d' | LC_ALL=C sort
            )
          }

          validate_asset_names() {
            have_archive=false
            have_checksums=false
            local asset_name
            for asset_name in "${release_assets[@]}"; do
              case "$asset_name" in
                "$archive")
                  if [[ "$have_archive" == "true" ]]; then
                    echo "duplicate release asset: $asset_name" >&2
                    return 1
                  fi
                  have_archive=true
                  ;;
                SHA256SUMS)
                  if [[ "$have_checksums" == "true" ]]; then
                    echo "duplicate release asset: $asset_name" >&2
                    return 1
                  fi
                  have_checksums=true
                  ;;
                *)
                  echo "refusing to mutate a release with unexpected asset: $asset_name" >&2
                  return 1
                  ;;
              esac
            done
          }

          verify_asset() {
            local asset_name="$1"
            local download_dir="$2"
            mkdir -p "$download_dir"
            gh release download "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$download_dir"
            if ! cmp --silent "$asset_name" "$download_dir/$asset_name"; then
              echo "existing release asset does not match verified bundle: $asset_name" >&2
              return 1
            fi
          }

          load_assets
          validate_asset_names
          existing_dir="$RUNNER_TEMP/existing-prerelease-assets"
          if [[ "$have_archive" == "true" ]]; then
            verify_asset "$archive" "$existing_dir"
          fi
          if [[ "$have_checksums" == "true" ]]; then
            verify_asset SHA256SUMS "$existing_dir"
          fi

          if [[ "$is_draft" != "true" ]]; then
            if [[ "$have_archive" != "true" || "$have_checksums" != "true" ]]; then
              echo "published prerelease is missing one or more verified assets" >&2
              exit 1
            fi
            verify_remote_tag
            echo "Published prerelease and both assets already match the verified bundle"
            exit 0
          fi

          # This is a source-only GitHub release; no package registry command is
          # invoked. Upload only missing draft assets without overwrite
          # semantics, so an existing asset is accepted only after comparison.
          if [[ "$have_archive" != "true" ]]; then
            verify_remote_tag
            gh release upload "$RELEASE_TAG" \
              "$archive#Source archive with stable top-level directory" \
              --repo "$RELEASE_REPOSITORY"
          fi
          if [[ "$have_checksums" != "true" ]]; then
            verify_remote_tag
            gh release upload "$RELEASE_TAG" \
              "SHA256SUMS#SHA-256 checksums" \
              --repo "$RELEASE_REPOSITORY"
          fi

          load_assets
          validate_asset_names
          if [[ "$have_archive" != "true" || "$have_checksums" != "true" ]]; then
            echo "draft prerelease is missing one or more verified assets after upload" >&2
            exit 1
          fi
          verified_dir="$RUNNER_TEMP/verified-prerelease-assets"
          verify_asset "$archive" "$verified_dir"
          verify_asset SHA256SUMS "$verified_dir"

          verify_remote_tag
          gh release edit "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --draft=false \
            --prerelease=true \
            --latest=false
          verify_remote_tag

          final_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --json isDraft,isPrerelease,name,body
          )"
          if [[ "$(jq -r '.isDraft' <<<"$final_json")" != "false" || \
                "$(jq -r '.isPrerelease' <<<"$final_json")" != "true" || \
                "$(jq -r '.name' <<<"$final_json")" != "$expected_title" || \
                "$(jq -r '.body' <<<"$final_json")" != "$expected_body" ]]; then
            echo "GitHub prerelease finalization did not preserve the verified release identity" >&2
            exit 1
          fi

name: v0.9 release evidence

on:
  workflow_dispatch:
    inputs:
      evidence_url:
        description: HTTPS URL of exact-candidate evidence
        required: true
        type: string
      evidence_sha256:
        description: Lowercase SHA-256 of the evidence ZIP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v09-release-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact evidence candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and validate exact-candidate evidence
        env:
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$(bash scripts/release-evidence-profile.sh "$version")" == v09 ]]
          [[ "$EVIDENCE_URL" == https://* ]]
          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/v09-release-evidence.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 \
            --max-filesize 268435456 \
            --output "$archive" "$EVIDENCE_URL"
          echo "$EVIDENCE_SHA256  $archive" | sha256sum --check -
          tree="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/check-v09-release-evidence.py "$archive" "$GITHUB_SHA" "$tree" \
            > "$RUNNER_TEMP/v09-evidence-validation.txt"
          cat "$RUNNER_TEMP/v09-evidence-validation.txt"

      - name: Preserve validated release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v09-release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v09-release-evidence.zip
            ${{ runner.temp }}/v09-evidence-validation.txt
          if-no-files-found: error
          retention-days: 90

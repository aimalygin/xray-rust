[package]
name = "xray-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
tokio = { version = "1.52.3", features = ["io-util", "rt"] }
xray-config = { path = "../crates/xray-config" }
xray-core-rs = { path = "../crates/xray-core-rs", features = ["fuzzing"] }
xray-ffi = { path = "../crates/xray-ffi" }
xray-proxy = { path = "../crates/xray-proxy" }
xray-transport = { path = "../crates/xray-transport" }
xray-tun = { path = "../crates/xray-tun" }

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_wire"
path = "fuzz_targets/dns_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vless_wire"
path = "fuzz_targets/vless_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_lifecycle"
path = "fuzz_targets/ffi_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inbound_wire"
path = "fuzz_targets/inbound_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_sniff"
path = "fuzz_targets/quic_sniff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xhttp_framing"
path = "fuzz_targets/xhttp_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tun_queue"
path = "fuzz_targets/tun_queue.rs"
test = false
doc = false
bench = false

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums">
<title id="t">Phone: peak RSS, TUN profile Mobile vs MobilePlus — lower is better</title>
<desc id="d">Peak RSS of the devicehost process for TUN profiles Mobile and MobilePlus at 64 and 256 concurrent flows on a OnePlus 15, with TUN packet drops annotated. Values are in data/protocols-memory.csv.</desc>
<rect x="0.5" y="0.5" width="879" height="407" rx="8" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.10"/>
<text x="24.0" y="42.0" font-size="17" font-weight="600" fill="#f0efec" text-anchor="start">Phone: peak RSS, TUN profile Mobile vs MobilePlus — lower is better</text>
<text x="24.0" y="61.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">OnePlus 15 (SM8850), Android 17 · 2026-11-01 · loopback, CPU-bound · Go Xray v26.10.21 server on the phone · VLESS raw ·</text>
<text x="24.0" y="80.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">median of 5 runs with min–max</text>
<text x="24.0" y="99.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">N concurrent downloads through the TUN (64×16 MiB or 256×4 MiB), fresh process per run. Peak = VmHWM of the devicehost process,</text>
<text x="24.0" y="118.0" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">which includes ~183 MiB of ART baseline.</text>
<rect x="24" y="134" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="41.0" y="144.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">Mobile (256 active flows, 64 pending opens)</text>

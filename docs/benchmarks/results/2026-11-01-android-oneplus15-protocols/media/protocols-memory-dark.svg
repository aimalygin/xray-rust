<text x="463.9" y="144.0" font-size="12" font-weight="600" fill="#d03b3b" text-anchor="start">⚠︎</text>
<text x="480.9" y="144.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">TUN packet drops</text>

[package]
name = "gotatun"
description = "an implementation of the WireGuard® protocol designed for portability and speed"
version = "0.9.1"
authors = ["Noah Kennedy <nkennedy@cloudflare.com>", "Andy Grover <agrover@cloudflare.com>", "Jeff Hiner <jhiner@cloudflare.com>", "Mullvad VPN"]
rust-version = "1.95"
edition = "2024"
repository = "https://github.com/mullvad/gotatun"
license = "MPL-2.0"
categories = ["asynchronous", "network-programming"]
keywords = ["vpn", "wireguard"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android"
]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
zeroize = { version = "1.8.2", features = ["alloc"] }
aead = { version = "0.5.2" }
aws-lc-rs = { version = "1.16.2", optional = true }
base64 = { version = "0.22.1" }
bitfield-struct = { version = "0.12.1" }
blake2 = { version = "0.10.6" }
bytes = { version = "1.11.1" }
chacha20poly1305 = { version = "0.10.1" }
constant_time_eq = { version = "0.4.2" }
duplicate = { version = "2.0.0", default-features = false }
either = { version = "1.15.0" }
eyre = { version = "0.6.12" }
futures = { version = "0.3.31" }
hex = { version = "0.4.3" }
hmac = { version = "0.12.1" }
ip_network = { version = "0.4.1" }
ip_network_table = { version = "0.2.0" }
ipnetwork = { version = "0.21.1" }
libc = { version = "0.2.180" }
maybenot = { version = "2.2.2", optional = true }
mock_instant = { version = "0.6", optional = true }
parking_lot = { version = "0.12.5" }
pcap-file = { version = "2.0.0", optional = true }
rand = { version = "0.9.2" }
rand_chacha = { version = "0.9.0" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ring = { version = "0.17.14", optional = true }
socket2 = { version = "0.6.5", features = ["all"], optional = true }
thiserror = { version = "1" }
tokio = { version = "1.43.0", features = ["sync", "rt", "time", "macros", "io-util"] }
tokio-util = { version = "0.7.18", default-features = false }
tracing = { version = "0.1.40" }
tun = { version = "0.8.6", default-features = false, features = ["async"], optional = true }
typed-builder = { version = "0.21.0" }
x25519-dalek = { version = "2.0.1", features = [
  "reusable_secrets",
  "static_secrets",
] }
zerocopy = { version = "0.8.27", features = ["derive", "std"] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
etherparse = { version = "0.13" }
test-log = { version = "0.2.19", default-features = false, features = ["trace"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom"] }

[target.'cfg(target_os = "windows")'.dependencies]
wintun-bindings = { version = "0.7.39", default-features = false, optional = true }
windows-sys = { version = ">=0.60, <=0.61", features = [
  "Win32",
  "Win32_Foundation",
  "Win32_Networking",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
  "fs",
  "net",
  "socket",
  "time",
  "uio",
  "user",
] }

[features]
default = ["aws-lc-rs"]
daita = ["device", "dep:maybenot"]
# Use the `ring` crate as the AEAD backend. Combine with
# `default-features = false` to avoid also pulling in `aws-lc-rs`,
# which would otherwise be compiled and linked unused.
ring = ["dep:ring"]
# Use the `aws-lc-rs` crate as the AEAD backend. Default. At least
# one of `ring` and `aws-lc-rs` must be enabled; `aws-lc-rs` wins
# if both are.
aws-lc-rs = ["dep:aws-lc-rs"]
# Add non-compliant UAPI support for DAITA.
# See `UAPI.md` for details.
daita-uapi = ["daita"]
device = ["tokio/net", "socket"]
socket = ["dep:socket2", "tokio/net"]
pcap = ["dep:pcap-file"]
tun = ["dep:tun", "dep:wintun-bindings"]
# UDP GRO appears to be broken on Windows.
# In some cases it fails to return UDP_COALESCED_INFO
windows-gro = []
